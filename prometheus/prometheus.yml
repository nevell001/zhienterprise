global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'zhienterprise-monitor'

# 告警规则（服务不可达 / 5xx / P95 / 堆内存 / 连接池 / GC）
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # 监控 Spring Boot Actuator
  - job_name: 'spring-boot-actuator'
    metrics_path: '/manage/actuator/prometheus'
    static_configs:
      - targets: ['zhi-admin:8080']
        labels:
          application: 'zhienterprise'
    scrape_interval: 10s
    scrape_timeout: 10s

  # 监控 Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']