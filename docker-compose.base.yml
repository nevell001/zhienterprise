# Docker Compose 公共基础片段：mysql / redis / prometheus / grafana + 数据卷 + 网络
#
# 不要单独用它部署完整站点（它没有应用服务）。dev / prod / release 三套编排通过
#   extends:
#     file: docker-compose.base.yml
#     service: xxx
# 继承这里的定义，只覆盖各自差异（SQL 初始化脚本来源、监控是否默认启动、端口暴露等）。
# 公共段（镜像版本、健康检查、资源限额、MySQL/Redis 参数）只在这里改一处。
#
# ⚠️ 发布 release 附件时本文件必须和 docker-compose.release.yml 放在同一目录。

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: always
    command: >
      --mysql_native_password=ON
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=256M
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-zhienterprise}
      MYSQL_USER: ${DB_USERNAME:-zhienterprise_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"  # 仅本地访问，远端请走 SSH 隧道
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 20
      interval: 10s
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - zhi-network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    command: >
      sh -c '
        if [ -n "${REDIS_PASSWORD:-}" ]; then
          redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        else
          redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
      '
    ports:
      - "127.0.0.1:6379:6379"  # 仅本地访问
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c '
          if [ -n "${REDIS_PASSWORD:-}" ]; then
            redis-cli -a "${REDIS_PASSWORD}" ping
          else
            redis-cli ping
          fi
        '
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - zhi-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"  # 仅本地访问，安全考虑
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - zhi-network

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    restart: always
    ports:
      - "127.0.0.1:3001:3000"  # 仅本地访问，安全考虑
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PROVISIONING_ENABLED: "true"
      GF_INSTALL_PLUGINS: ""
    healthcheck:
      # 用 127.0.0.1 而不是 localhost：busybox wget 会把 localhost 解析成 ::1，
      # Grafana 未监听 IPv6 时健康检查会一直失败
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - zhi-network
    # depends_on 由各环境编排自行追加（extends 不允许被继承的服务声明 depends_on）

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  zhi-network:
    driver: bridge
