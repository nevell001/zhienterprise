# Docker Compose 生产环境配置
# 警告：必须配置 .env 文件并设置强密码
# 所有敏感信息必须通过环境变量配置，不能使用默认值
#
# 公共基础设施（mysql / redis / prometheus / grafana、数据卷、网络）定义在
# docker-compose.base.yml，这里通过 extends 继承；监控栈默认不启动（profiles: monitoring）。

services:
  mysql:
    extends:
      file: docker-compose.base.yml
      service: mysql
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro

  redis:
    extends:
      file: docker-compose.base.yml
      service: redis

  # 监控栈（可选）：默认不随 `up -d` 启动，企业站点交付零负担；自用运维时显式启用：
  #   docker compose -f docker-compose.prod.yml --profile monitoring up -d
  # 停用监控（不影响站点）：--profile monitoring rm -sf prometheus grafana
  # 不要用 down：那会把 mysql / 后端 / 前端一起停掉
  prometheus:
    extends:
      file: docker-compose.base.yml
      service: prometheus
    profiles: ["monitoring"]

  grafana:
    extends:
      file: docker-compose.base.yml
      service: grafana
    depends_on:
      - prometheus
    profiles: ["monitoring"]

  zhi-admin:
    build:
      context: .
      dockerfile: Dockerfile-admin
    container_name: zhi-admin
    # 仅本机暴露：对外统一走 nginx，避免绕过反代直连后端（限流/审计都依赖反代）
    ports:
      - "127.0.0.1:8080:8080"
    # 邮件/验证码/上传上限等配置来自 .env；缺了它这些变量在容器里全是空值
    env_file:
      - .env
    volumes:
      - ./uploadPath:/app/uploadPath
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '0.5'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-zhienterprise_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-zhienterprise}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      R_TOKEN_SECRET: ${R_TOKEN_SECRET}
      DRUID_USERNAME: ${DRUID_USERNAME:-nevell}
      DRUID_PASSWORD: ${DRUID_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      # 直接设置 Spring Boot 配置属性
      SPRING_DATASOURCE_DRUID_STATVIEWSERVLET_LOGIN_USERNAME: ${DRUID_USERNAME:-nevell}
      SPRING_DATASOURCE_DRUID_STATVIEWSERVLET_LOGIN_PASSWORD: ${DRUID_PASSWORD}
    networks:
      - zhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/manage/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  zhi-ui:
    build:
      context: ./zhi-ui
      dockerfile: Dockerfile.prod
    image: zhi-ui:prod
    container_name: zhi-ui
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      zhi-admin:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DOCKER: "true"
      VUE_APP_BASE_API: http://localhost
      VUE_APP_ENV: production
      NGINX_HOST: ${NGINX_HOST:-localhost}
      NGINX_PORT: 80
    volumes:
      - ./zhi-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./zhi-ui/ssl:/etc/nginx/ssl:ro  # SSL证书目录
      # 启用 HTTPS：把上面 default.conf 的挂载换成 ./zhi-ui/nginx-https.conf，
      # 并在 zhi-ui/ssl/ 放置 fullchain.pem 与 privkey.pem（见 zhi-ui/nginx-https.conf 注释）
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - zhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  zhi-network:
    driver: bridge
