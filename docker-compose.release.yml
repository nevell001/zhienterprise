# Docker Compose - 基于 Release 产物的部署编排（不重新构建源码）
#
# 用法：
#   1. 下载 release 附件 zhi-admin.jar / frontend-dist.zip / deploy-assets.zip
#   2. 按 docs/DEPLOYMENT_RELEASE.md 整理到 ./deploy/ 并解压（本文件与 docker-compose.base.yml 放同一目录）
#   3. cp deploy/.env.example .env  并设置强密码 / R_TOKEN_SECRET
#   4. docker compose -f docker-compose.release.yml up -d
#
# 公共基础设施（mysql / redis / prometheus / grafana、数据卷、网络）在 docker-compose.base.yml，
# 这里通过 extends 继承；监控栈默认不启动（企业站点交付零负担），需要时显式加 --profile monitoring。

services:
  mysql:
    extends:
      file: docker-compose.base.yml
      service: mysql
    volumes:
      - ./deploy/sql:/docker-entrypoint-initdb.d:ro

  redis:
    extends:
      file: docker-compose.base.yml
      service: redis

  # 监控栈（可选）：默认不随 `up -d` 启动；需要时显式启用：
  #   docker compose -f docker-compose.release.yml --profile monitoring up -d
  # 停用监控（不影响站点）：--profile monitoring rm -sf prometheus grafana
  # 不要用 down：那会把 mysql / 后端 / 前端一起停掉
  prometheus:
    extends:
      file: docker-compose.base.yml
      service: prometheus
    profiles: ["monitoring"]

  grafana:
    extends:
      file: docker-compose.base.yml
      service: grafana
    depends_on:
      - prometheus
    profiles: ["monitoring"]

  zhi-admin:
    image: eclipse-temurin:17-jre
    container_name: zhi-admin
    command: ["java", "-jar", "/app/zhi-admin.jar"]
    ports:
      - "127.0.0.1:8080:8080"  # 仅本地访问，对外走 nginx
    # logback 用相对路径 ./logs，必须固定工作目录，否则日志会落到 /logs 而不是挂载点
    working_dir: /app
    volumes:
      - ./deploy/zhi-admin.jar:/app/zhi-admin.jar:ro
      - ./uploadPath:/app/uploadPath
      # 后端文件日志（logback 写入 /app/logs），命名卷保证容器重建后不丢
      - admin_logs:/app/logs
    # 控制台日志走 docker logs；限制单文件大小，避免长期运行撑满磁盘
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # 邮件/验证码/上传上限等配置来自 .env；缺了它这些变量在容器里全是空值
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-zhienterprise_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-zhienterprise}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      R_TOKEN_SECRET: ${R_TOKEN_SECRET}
      DRUID_USERNAME: ${DRUID_USERNAME:-nevell}
      DRUID_PASSWORD: ${DRUID_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    # 用 curl 打 Actuator（镜像自带 curl）。不要用 /dev/tcp：CMD-SHELL 走 /bin/sh(dash)，
    # dash 不支持 /dev/tcp，健康检查会永远失败，进而卡住依赖 service_healthy 的 zhi-ui
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/manage/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '0.5'
    networks:
      - zhi-network
    restart: unless-stopped

  zhi-ui:
    image: nginx:1.27-alpine
    container_name: zhi-ui
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      zhi-admin:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/frontend-dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro  # HTTPS 证书目录（启用 HTTPS 时放入 fullchain.pem/privkey.pem 并把挂载换成 nginx-https.conf）
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      # 用 curl（镜像自带）而不是 busybox wget：wget 会把 localhost 解析成 ::1，
      # 而 nginx 只监听 IPv4，健康检查会一直失败（容器永远 unhealthy）
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - zhi-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  admin_logs:

networks:
  zhi-network:
    driver: bridge
