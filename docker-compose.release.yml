# Docker Compose - 基于 Release 产物的部署编排（不重新构建源码）
#
# 用法：
#   1. 下载 release 附件 zhi-admin.jar / frontend-dist.zip / deploy-assets.zip
#   2. 按 docs/DEPLOYMENT_RELEASE.md 整理到 ./deploy/ 并解压
#   3. cp deploy/.env.example .env  并设置强密码 / R_TOKEN_SECRET
#   4. docker compose -f docker-compose.release.yml up -d

services:
  zhi-admin:
    image: eclipse-temurin:17-jre
    container_name: zhi-admin
    command: ["java", "-jar", "/app/zhi-admin.jar"]
    ports:
      - "127.0.0.1:8080:8080"  # 仅本地访问，对外走 nginx
    volumes:
      - ./deploy/zhi-admin.jar:/app/zhi-admin.jar:ro
      - ./uploadPath:/app/uploadPath
    # 邮件/验证码/上传上限等配置来自 .env；缺了它这些变量在容器里全是空值
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-zhienterprise_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-zhienterprise}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      R_TOKEN_SECRET: ${R_TOKEN_SECRET}
      DRUID_USERNAME: ${DRUID_USERNAME:-nevell}
      DRUID_PASSWORD: ${DRUID_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    # 用 curl 打 Actuator（镜像自带 curl）。不要用 /dev/tcp：CMD-SHELL 走 /bin/sh(dash)，
    # dash 不支持 /dev/tcp，健康检查会永远失败，进而卡住依赖 service_healthy 的 zhi-ui
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/manage/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '0.5'
    networks:
      - zhi-network
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: always
    command: >
      --mysql_native_password=ON
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=256M
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-zhienterprise}
      MYSQL_USER: ${DB_USERNAME:-zhienterprise_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"  # 仅本地访问
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 20
      interval: 10s
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - zhi-network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    command: >
      sh -c '
        if [ -n "${REDIS_PASSWORD:-}" ]; then
          redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        else
          redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
      '
    ports:
      - "127.0.0.1:6379:6379"  # 仅本地访问
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c '
          if [ -n "${REDIS_PASSWORD:-}" ]; then
            redis-cli -a "${REDIS_PASSWORD}" ping
          else
            redis-cli ping
          fi
        '
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - zhi-network

  zhi-ui:
    image: nginx:1.27-alpine
    container_name: zhi-ui
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      zhi-admin:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/frontend-dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro  # HTTPS 证书目录（启用 HTTPS 时放入 fullchain.pem/privkey.pem 并把挂载换成 nginx-https.conf）
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      # 用 curl（镜像自带）而不是 busybox wget：wget 会把 localhost 解析成 ::1，
      # 而 nginx 只监听 IPv4，健康检查会一直失败（容器永远 unhealthy）
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - zhi-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"  # 仅本地访问，安全考虑
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - zhi-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    restart: always
    ports:
      - "127.0.0.1:3001:3000"  # 仅本地访问，安全考虑
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PROVISIONING_ENABLED: "true"
      GF_INSTALL_PLUGINS: ""
    depends_on:
      - prometheus
    networks:
      - zhi-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  zhi-network:
    driver: bridge
