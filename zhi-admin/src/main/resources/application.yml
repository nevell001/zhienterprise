# 项目相关配置
ruoyi:
  # 名称
  name: 知企建站系统
  # 版本（从 Maven 属性读取，统一管理）
  version: @app.version@
  # 版权年份
  copyrightYear: 2026
  # 文件路径
  profile: ./uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 100
    threads:
      # tomcat最大线程数，默认为200
      max: 200
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 10

# 日志配置
logging:
  level:
    com.zhi: debug
    org.springframework: warn
    com.zhi.system.mapper: debug  # 开启MyBatis SQL日志

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 加载仓库根目录的 .env（无扩展名文件按 properties 解析；./ 与 ../ 双兜底，
  # 无论从仓库根还是 zhi-admin/ 目录启动都能读到，不再依赖 spring-dotenv 的工作目录行为）
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 主库数据源
      master:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zhiblog}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:#{null}}
        driverClassName: com.mysql.cj.jdbc.Driver
        # 从库数据源
        slave:
          # 从数据源开关/默认关闭
          enabled: false
          url:
          username:
          password:
        # 初始连接数
        initial-size: 10
        # 最小连接池数量
        min-idle: 10
        # 最大连接池数量
        max-active: 20
        # 配置获取连接等待超时的时间
        max-wait: 10000
        # 配置连接超时时间
        connect-timeout: 30000
        # 配置网络超时时间
        socket-timeout: 60000
        # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        time-between-eviction-runs-millis: 60000
        # 配置一个连接在池中最小生存的时间，单位是毫秒
        min-evictable-idle-time-millis: 300000
        # 配置一个连接在池中最大生存的时间，单位是毫秒
        max-evictable-idle-time-millis: 900000
        # 配置检测连接是否有效
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # MVC 配置
  mvc:
    static-path-pattern: /static/**
  # Web 资源配置
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/
  # 欢迎页面配置
  main:
    banner-mode: off
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # Redis URL（优先级最高，覆盖 host 和 port 配置）
    url: redis://${REDIS_PASSWORD:}@${REDIS_HOST:redis}:${REDIS_PORT:6379}
    # 地址
    host: ${REDIS_HOST:redis}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: 0
    # 密码
    # 警告：生产环境强烈建议设置Redis密码
    password: ${REDIS_PASSWORD:#{null}}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
  # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 600s  # 默认缓存10分钟
      cache-null-values: false
      key-prefix: "blog:"
      use-key-prefix: true
  # 邮件服务配置
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:#{null}}
    password: ${MAIL_PASSWORD:#{null}}
    protocol: smtp
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: false
          ssl:
            enable: ${MAIL_SSL:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
    default-encoding: UTF-8

# 邮件验证码配置
email-code:
  # 验证码有效期（分钟）
  expire-minutes: ${EMAIL_CODE_EXPIRE_MINUTES:5}
  # 验证码长度
  code-length: ${EMAIL_CODE_LENGTH:6}
  # 邮箱发送频率限制（秒）
  rate-limit-seconds: ${EMAIL_CODE_RATE_LIMIT_SECONDS:60}
  # IP频率限制（每小时最大发送次数）
  ip-rate-limit: ${EMAIL_CODE_IP_RATE_LIMIT:10}
  # 开发环境是否在控制台打印验证码（不发送真实邮件）
  dev-print-code: ${EMAIL_DEV_PRINT_CODE:false}
  # 验证码最大错误次数（达到后锁定，防止爆破）
  max-verify-attempts: ${EMAIL_CODE_MAX_VERIFY_ATTEMPTS:5}
  # 错误尝试锁定时间（分钟）
  verify-lock-minutes: ${EMAIL_CODE_VERIFY_LOCK_MINUTES:5}

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（必须通过环境变量设置，至少64位）
  # 生产环境：必须设置R_TOKEN_SECRET环境变量
  # 开发环境：会使用临时密钥并记录警告
  # 生成方法：openssl rand -base64 64
  secret: ${R_TOKEN_SECRET:#{null}}
  # 令牌有效期（默认30分钟）
  expireTime: 30
  # 记住我令牌有效期（默认7天=10080分钟）
  rememberMeExpireTime: ${REMEMBER_ME_EXPIRE_MINUTES:10080}

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.zhi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# SpringDoc OpenAPI 配置（替代 Springfox，支持 Spring Boot 3.x）
springdoc:
  # 是否开启 API 文档
  api-docs:
    enabled: true
    # API 文档路径
    path: /v3/api-docs
  # Swagger UI 配置
  swagger-ui:
    enabled: true
    # Swagger UI 路径
    path: /swagger-ui.html
    # 默认展开所有接口
    default-models-expand-depth: -1
    # 默认展开所有标签
    default-model-expand-depth: 1
    # 启用深度链接
    deep-linking: true
    # 显示请求持续时间
    display-request-duration: true
    # 启用持久化授权
    persist-authorization: true
  # 分组配置
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.zhi

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/system/article,/manage/**
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 图片压缩配置
image:
  compress:
    # 是否启用图片压缩
    enabled: true
    # 压缩阈值（超过此大小才压缩）
    threshold-size: 2MB
    # 默认最大宽度
    max-width: 2560
    # 默认最大高度
    max-height: 1440
    # 默认压缩质量 (0.0-1.0) - 提高到0.9保持更好质量
    default-quality: 0.9
    # 头像压缩尺寸
    avatar-size: 200
    # 缩略图压缩尺寸
    thumbnail-size: 400
    # 头像压缩质量
    avatar-quality: 0.9
    # 缩略图压缩质量 - 提高到0.85
    thumbnail-quality: 0.85
    # 文章封面图宽度 - 提高到1200以支持更清晰的封面
    article-cover-width: 1200
    # 文章封面图高度 - 提高到675
    article-cover-height: 675
    # 文章封面图压缩质量 - 提高到0.9
    article-cover-quality: 0.9
    # 移动端最大宽度
    mobile-max-width: 750
    # 移动端压缩质量 - 提高到0.85
    mobile-quality: 0.85

# 防盗链配置（仅作为默认值；可在后台“站点设置-站点信息”中覆盖，数据库 blog_setting 优先）
referer:
  # 是否启用防盗链
  enabled: false
  # 允许的域名列表（逗号分隔）
  allowed-domains: localhost,127.0.0.1

# Spring Boot Actuator 监控配置
management:
  # 启用所有端点
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,prometheus
      base-path: /manage/actuator
  # 健康检查配置
  health:
    redis:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true
  # 应用信息配置
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# 应用信息配置
info:
  app:
    name: ${ruoyi.name}
    version: ${ruoyi.version}
    copyright-year: ${ruoyi.copyrightYear}
  build:
    artifact: zhi-admin
    name: zhi-admin
    description: 知企建站系统
  # 端点详情
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    metrics:
      enabled: true
      tags:
        application: ${spring.application.name}
    prometheus:
      enabled: true
  # Metrics 配置
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
