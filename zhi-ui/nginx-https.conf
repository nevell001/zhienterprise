# 知企建站系统 Nginx HTTPS 配置（可选）
#
# 启用步骤：
#   1. 将证书放到 zhi-ui/ssl/fullchain.pem 与 zhi-ui/ssl/privkey.pem
#      （release 部署为 deploy/ssl/ 下同名文件）
#   2. 把 docker-compose 里 default.conf 的挂载从 nginx.conf 换成 nginx-https.conf
#
# 注意：未放置证书时 nginx 无法启动；如需临时纯 HTTP，换回 nginx.conf 即可。

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头（location 内一旦出现 add_header，就不再继承 server 级配置，
    # 自带 add_header 的 location 需要重复声明）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 启用 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源缓存优化
    # 上传上限必须 ≥ 后端 max-request-size（统一 10MB），
    # 否则大于 1MB（nginx 默认值）的封面/媒体上传会被 nginx 直接 413
    client_max_body_size 20m;

    # 后端根路径上的非 SPA 端点：不代理的话会被下面的 try_files 回落成 index.html
    location = /sitemap.xml {
        proxy_pass http://zhi-admin:8080/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://zhi-admin:8080/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 站点前台页面均为短路径（/news、/article/:id 等），由下方 catch-all 的
    # try_files 回落 index.html 处理，无需为页面单独配置 location

    # 前端路由重定向 - 解决刷新页面显示 JSON 问题的核心配置
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 系统 API 代理到后端容器
    location /system/ {
        proxy_pass http://zhi-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 兼容原有的 prod-api 路径
    location ^~ /stage-api/ {
        proxy_pass http://zhi-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /prod-api/ {
        proxy_pass http://zhi-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容开发环境遗留的 dev-api 路径（历史文章内容中的图片链接）
    location ^~ /dev-api/ {
        proxy_pass http://zhi-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 站点公开 API + 系统 API：/api/** 原样转发到后端（不剥前缀）
    location ^~ /api/ {
        proxy_pass http://zhi-admin:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 统一由后端 ResourcesConfig（CORS_ALLOWED_ORIGINS）下发；
        # 这里不要再加 Access-Control-Allow-Origin，否则会绕过白名单对全互联网放开

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 代理静态资源访问（上传的图片、头像等）
    location ^~ /profile/ {
        proxy_pass http://zhi-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源缓存
        expires 7d;
        add_header Cache-Control "public, immutable";

        # 上传目录与前台同源：禁止 MIME 嗅探（配合上传后缀白名单，避免上传物被当页面执行）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 代理 Actuator 监控端点
    location /manage/ {
        proxy_pass http://zhi-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
