# SPA 软 404 修复：只有与前端路由对齐的路径才回落 index.html（200），
# 未注册路径返回真正的 404（响应体仍是 SPA 壳，由前端渲染 404 页）。
# 前端路由（zhi-ui/src/router）新增/调整后必须同步这里，nginx.config.test.ts 校验覆盖关系。
map $uri $zhi_spa_route {
    default 0;

    ~^/$ 1;

    # 前台固定页面
    ~^/(index|login|register|forgot-password|news|business|solutions|contact|about|honors|history|category|tag|guestbook|agreement|privacy|search|401|404)/?$ 1;

    # 前台动态页面：详情 / 分类 / 标签 / 自定义页面 / 友链申请 / 内容预览
    ~^/article/[^/]+/?$ 1;
    ~^/business/[^/]+/?$ 1;
    ~^/solutions/[^/]+/?$ 1;
    ~^/category/[^/]+/?$ 1;
    ~^/tag/[^/]+/?$ 1;
    ~^/page/[^/]+/?$ 1;
    ~^/preview/(article|business|solution)/[^/]+/?$ 1;
    ~^/friend-links/apply/?$ 1;

    # 后台路由由后端菜单动态下发、无法静态枚举，按前缀放行
    ~^/admin(/|$) 1;
    ~^/redirect/.+$ 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 安全响应头（location 内一旦出现 add_header，就不再继承 server 级配置，
    # 自带 add_header 的 location 需要重复声明）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS 仅在 nginx-https.conf 中下发：HTTP 响应里的 HSTS 会被浏览器忽略

    # 启用 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源缓存优化
    # 上传上限必须 ≥ 后端 max-request-size（统一 10MB），
    # 否则大于 1MB（nginx 默认值）的封面/媒体上传会被 nginx 直接 413
    client_max_body_size 20m;

    # 后端根路径上的非 SPA 端点：不代理的话会被下面的 try_files 回落成 index.html
    location = /sitemap.xml {
        proxy_pass http://zhi-admin:8080/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://zhi-admin:8080/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 站点前台页面均为短路径（/news、/article/:id 等），是否允许回落 index.html
    # 由顶部 $zhi_spa_route 白名单决定，无需为每个页面单独配置 location

    # 前端路由重定向 - 解决刷新页面显示 JSON 问题的核心配置
    location / {
        try_files $uri $uri/ @spa;
    }

    # 已知路由正常返回 index.html（200）；未注册路径返回 404 状态 + index.html 内容
    # （error_page 保留原状态码），由前端渲染 404 页，避免搜索引擎把任意错误链接当有效页
    location @spa {
        error_page 404 /index.html;

        if ($zhi_spa_route = 0) {
            return 404;
        }

        try_files /index.html =404;
    }

    # 系统 API 代理到后端容器
    location /system/ {
        proxy_pass http://zhi-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 兼容原有的 prod-api 路径
    location ^~ /stage-api/ {
        proxy_pass http://zhi-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /prod-api/ {
        proxy_pass http://zhi-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容开发环境遗留的 dev-api 路径（历史文章内容中的图片链接）
    location ^~ /dev-api/ {
        proxy_pass http://zhi-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 站点公开 API + 系统 API：/api/** 原样转发到后端（不剥前缀）
    location ^~ /api/ {
        proxy_pass http://zhi-admin:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 统一由后端 ResourcesConfig（CORS_ALLOWED_ORIGINS）下发；
        # 这里不要再加 Access-Control-Allow-Origin，否则会绕过白名单对全互联网放开

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 代理静态资源访问（上传的图片、头像等）
    location ^~ /profile/ {
        proxy_pass http://zhi-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源缓存
        expires 7d;
        add_header Cache-Control "public, immutable";

        # 上传目录与前台同源：禁止 MIME 嗅探（配合上传后缀白名单，避免上传物被当页面执行）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 代理 Actuator 监控端点
    location /manage/ {
        proxy_pass http://zhi-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
