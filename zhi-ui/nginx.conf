server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 启用 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源缓存优化
    # 上传上限必须 ≥ 后端 max-request-size（dev 20MB / prod 10MB），
    # 否则大于 1MB（nginx 默认值）的封面/媒体上传会被 nginx 直接 413
    client_max_body_size 20m;

    # 后端根路径上的非 SPA 端点：不代理的话会被下面的 try_files 回落成 index.html
    location = /sitemap.xml {
        proxy_pass http://zhi-admin:8080/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://zhi-admin:8080/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 站点前台页面均为短路径（/news、/article/:id 等），由下方 catch-all 的
    # try_files 回落 index.html 处理，无需为页面单独配置 location

    # 前端路由重定向 - 解决刷新页面显示 JSON 问题的核心配置
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 系统 API 代理到后端容器
    location /system/ {
        proxy_pass http://zhi-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 兼容原有的 prod-api 路径
    location ^~ /stage-api/ {
        proxy_pass http://zhi-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /prod-api/ {
        proxy_pass http://zhi-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容开发环境遗留的 dev-api 路径（历史文章内容中的图片链接）
    location ^~ /dev-api/ {
        proxy_pass http://zhi-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 站点公开 API + 系统 API：/api/** 原样转发到后端（不剥前缀）
    location ^~ /api/ {
        proxy_pass http://zhi-admin:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 公开接口被跨域消费（RSS/前端静态托管等）
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
    }

    # 代理静态资源访问（上传的图片、头像等）
    location ^~ /profile/ {
        proxy_pass http://zhi-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源缓存
        expires 7d;
        add_header Cache-Control "public, immutable";

        # 上传目录与前台同源：禁止 MIME 嗅探（配合上传后缀白名单，避免上传物被当页面执行）
        add_header X-Content-Type-Options nosniff always;
    }

    # 代理 Actuator 监控端点
    location /manage/ {
        proxy_pass http://zhi-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖而非追加，避免客户端伪造值被后端采信
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
