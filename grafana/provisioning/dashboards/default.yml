apiVersion: 1

# 预置仪表盘：容器启动时自动从本目录加载 JSON，无需手工导入
providers:
  - name: zhi-enterprise
    orgId: 1
    folder: 知企建站
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
